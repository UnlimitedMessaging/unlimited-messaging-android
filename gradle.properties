org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend the app talks to. Override per build without editing this file:
#   ./gradlew assembleDebug -Pum.apiBaseUrl=https://api.example.com
# The debug build talks to `pnpm dev` on the developer's machine through
# `adb reverse` (see docs/DEVELOPMENT.md): localhost on the phone is the
# computer, for the API (19300) and the website's sign-in page (19400).
um.apiBaseUrl.debug=http://localhost:19300
um.apiBaseUrl.release=https://api.unlimitedmessaging.app

# OAuth public client the backend registers for this app (see docs/API_CONTRACT.md).
um.oauthClientId=um-android
um.oauthScope=device
