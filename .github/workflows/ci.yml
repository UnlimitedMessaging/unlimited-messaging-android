name: CI

# Every pull request, and every push to a branch other than main (main runs
# the full release workflow instead, which includes the same checks).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, debug build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/

      - name: Notify Discord of the failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          .github/scripts/discord-notify.sh fail "CI failed" \
            "Lint, tests or build failed on \`${{ github.ref_name }}\`." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
