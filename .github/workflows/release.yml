name: Release

# Every push to main builds a signed APK and publishes it as a GitHub release
# (tag v0.1.<run number>), with its SHA-256. See docs/RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION_BASE: "0.1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        run: |
          {
            echo "code=${GITHUB_RUN_NUMBER}"
            echo "name=${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
            echo "tag=v${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::UM_ANDROID_KEYSTORE_BASE64 is not set, see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Lint, unit tests, signed release build
        env:
          UM_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          UM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UM_ANDROID_KEYSTORE_PASSWORD }}
          UM_ANDROID_KEY_ALIAS: ${{ secrets.UM_ANDROID_KEY_ALIAS }}
          UM_ANDROID_KEY_PASSWORD: ${{ secrets.UM_ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew lintDebug testDebugUnitTest assembleRelease --stacktrace
          -Pum.versionCode=${{ steps.version.outputs.code }}
          -Pum.versionName=${{ steps.version.outputs.name }}

      - name: Check the signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -q "SHA-256 digest" signature.txt

      - name: Name the APK after the version, checksum it
        id: apk
        run: |
          name="unlimited-messaging-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          # A stable name too, so the website can link to the latest release directly.
          cp "$name" unlimited-messaging.apk
          sha256sum "$name" > "$name.sha256"
          {
            echo "name=$name"
            echo "sha256=$(cut -d' ' -f1 "$name.sha256")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Unlimited Messaging ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            Download **${{ steps.apk.outputs.name }}** below and open it on your Android phone (Android 8.0 or newer).
            See the [README](${{ github.server_url }}/${{ github.repository }}#install) for installation and permissions.

            SHA-256: `${{ steps.apk.outputs.sha256 }}`
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
            unlimited-messaging.apk

      - name: Notify Discord of the release
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          .github/scripts/discord-notify.sh success \
            "Android app ${{ steps.version.outputs.name }} released" \
            "Signed APK published: **${{ steps.apk.outputs.name }}**" \
            "${{ steps.release.outputs.url }}"

      - name: Notify Discord of the failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          .github/scripts/discord-notify.sh fail "Android release failed" \
            "The release build of \`${{ github.sha }}\` failed." \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
